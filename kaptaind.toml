# kaptaind configuration for workhorse
[project]
name = "workhorse"
path = "/home/sal/workhorse"
language = "rust"

[project.owners]
primary = "info@seriousaboutsolutions.co.uk"

[project.release]
version_file = "Cargo.toml"
semver_format = "{major}.{minor}.{patch}"
auto_tag = true
auto_release = false

[project.git]
remote = "github-seriousaboutsolutions:seriousaboutsolutions/workhorse.git"
branch = "main"

[project.analysis]
watch = ["src/", "Cargo.toml", "workhorse/", "tests/", "docs/"]
ignore = ["target", "*.egg-info", "__pycache__", ".pytest_cache", "*.pyc"]

[project.analysis.tools]
pytest = true
mypy = false

[project.hooks]
pre_commit = ["cargo test", "python3 -m pytest tests/ -v"]

[trust]
execution = "trusted"

[project.ai]
model = "provider-neutral"
api_key_variables = ["ANTHROPIC_API_KEY", "GEMINI_API_KEY", "GROQ_API_KEY", "MISTRAL_API_KEY", "OLLAMA_HOST", "OPENAI_API_KEY", "OPENROUTER_API_KEY", "XAI_API_KEY"]

[project.budget]
max_tokens_per_commit = 2000
max_tokens_per_release = 5000
