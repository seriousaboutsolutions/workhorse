# kaptaind configuration for workhorse
[project]
name = "workhorse"
path = "/home/sal/workhorse"
language = "python"

[project.owners]
primary = "info@seriousaboutsolutions.co.uk"

[project.release]
version_file = "pyproject.toml"
semver_format = "{major}.{minor}.{patch}"
auto_tag = true
auto_release = false

[project.git]
remote = "github-seriousaboutsolutions:seriousaboutsolutions/workhorse.git"
branch = "main"

[project.analysis]
watch = ["workhorse/", "tests/", "docs/"]
ignore = ["*.egg-info", "__pycache__", ".pytest_cache", "*.pyc"]

[project.analysis.tools]
pytest = true
mypy = false

[project.hooks]
pre_commit = ["python3 -m pytest tests/ -v"]

[project.ai]
model = "groq"
groq_api_key = "GROQ_API_KEY"

[project.budget]
max_tokens_per_commit = 2000
max_tokens_per_release = 5000
